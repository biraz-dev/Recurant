[package]
name = "zrpg_android"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "ZRPG Android entry point (GameActivity)."
publish = false

[lib]
# Loaded by MainActivity as libzrpg_android.so.
crate-type = ["cdylib"]

[dependencies]
zrpg = { path = "../zrpg" }

[dependencies.bevy]
version = "0.19.1"
default-features = false
features = ["android-game-activity"]
